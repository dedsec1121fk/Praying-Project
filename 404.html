<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#8fd0f6" />
  <meta name="description" content="A bilingual English/Greek interactive Orthodox web of Scripture, saints and heavenly beings." />
  <title>Orthodox Web • Ορθόδοξος Ιστός</title>
  <link rel="stylesheet" href="web/assets/css/styles.css" />
</head>
<body>
  <main class="web-app" id="top">
    <header class="search-dock" aria-label="Search and language">
      <label class="searchbox" for="search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Search a saint, apostle, angel…" autocomplete="off" spellcheck="false" aria-label="Search the Orthodox web" />
        <span id="matchCount" class="match-count" aria-live="polite"></span>
        <span class="lang-switch" role="group" aria-label="Language">
          <button class="lang active" data-lang="en" type="button">EN</button>
          <button class="lang" data-lang="el" type="button">ΕΛ</button>
        </span>
      </label>
    </header>

    <section id="network" class="network" tabindex="0" aria-label="Interactive Orthodox web">
      <div id="scene" class="scene">
        <svg id="webLines" class="web-lines" viewBox="0 0 3500 2700" preserveAspectRatio="none" aria-hidden="true"></svg>

        <div class="holy-center" aria-label="The Cross and the Holy Trinity">
          <div class="trinity-node trinity-father">
            <span class="trinity-symbol">✦</span>
            <b data-i18n="father">Father</b>
          </div>
          <div class="trinity-node trinity-son">
            <span class="trinity-symbol christogram">IC&nbsp;XC</span>
            <b data-i18n="son">Son</b>
          </div>
          <div class="trinity-node trinity-spirit">
            <span class="trinity-symbol dove" aria-hidden="true">✧</span>
            <b data-i18n="spirit">Holy Spirit</b>
          </div>
          <div class="cross-core">
            <span class="orthodox-cross" aria-hidden="true">☦</span>
            <strong data-i18n="trinity">HOLY TRINITY</strong>
            <small data-i18n="centerSub">Father • Son • Holy Spirit</small>
          </div>
        </div>

        <div id="nodes" class="nodes"></div>
      </div>
      <div id="emptyState" class="empty-state" hidden data-i18n="none">No matches</div>
    </section>
  </main>

  <dialog id="detailModal" class="modal">
    <div class="modal-shell">
      <button id="closeModal" class="modal-close" aria-label="Close">×</button>
      <div class="modal-media">
        <img id="modalImage" alt="" />
        <div class="image-shade"></div>
        <div class="modal-badge" id="modalCategory"></div>
      </div>
      <div class="modal-content">
        <div class="modal-kicker" id="modalRole"></div>
        <h2 id="modalName"></h2>
        <div class="meta-grid">
          <div><small data-i18n="feastDay">Feast / commemoration</small><strong id="modalFeast"></strong></div>
          <div><small data-i18n="scripture">Scripture</small><strong id="modalScripture"></strong></div>
        </div>
        <a id="modalImageCredit" class="image-credit" href="#" target="_blank" rel="noopener noreferrer" hidden></a>
        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="story" data-i18n="story" type="button">Story</button>
          <button class="tab" data-tab="prayer" data-i18n="prayer" type="button">Prayer</button>
          <button class="tab" data-tab="notes" data-i18n="notes" type="button">Notes</button>
        </div>
        <div id="modalNotice" class="modal-notice" hidden></div>
        <div id="tabBody" class="tab-body"></div>
      </div>
    </div>
  </dialog>

  <script src="web/data/entries.js"></script>
  <script src="web/data/expanded-biblical.js"></script>
  <script src="web/data/church-saints.js"></script>
  <script src="web/data/feasts.js"></script>
  <script src="web/data/biblical-context.js"></script>
  <script src="web/data/further-expansion.js"></script>
  <script src="web/data/deep-biblical.js"></script>
  <script src="web/data/comprehensive-expansion.js"></script>
  <script src="web/data/v7-expansion.js"></script>
  <script src="web/data/v8-expansion.js"></script>
  <script src="web/data/catalog.js"></script>
  <script src="web/data/media-manifest.js"></script>
  <script src="web/data/deep-profiles.js"></script>
  <script src="web/data/deep-profiles-2.js"></script>
  <script src="web/data/deep-profiles-3.js"></script>
  <script src="web/data/profile-enricher.js"></script>
  <script src="web/assets/js/app.js"></script>
</body>
</html>
